<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试密码管理</title>
  <link rel="stylesheet" href="./styles.css?v=20260811-release-d">
</head>
<body>
  <div class="ambient ambient--left" aria-hidden="true"></div>
  <div class="ambient ambient--right" aria-hidden="true"></div>

  <main class="page-shell page-shell--admin">
    <section class="stage-card admin-card">
      <div class="admin-head">
        <div class="admin-copy">
          <p class="section-kicker">密码管理</p>
          <h1>一键生成新的测试密码</h1>
          <p class="result-lead" id="admin-lead"></p>
          <p class="helper-text" id="admin-helper"></p>
        </div>

        <div class="admin-actions">
          <button class="primary-button primary-button--hero" id="generate-password" type="button">生成一个新密码</button>
          <button class="secondary-button" id="copy-latest-password" type="button">复制最新密码</button>
          <button class="secondary-button" id="copy-send-text" type="button">复制发送文案</button>
        </div>
      </div>

      <div class="admin-grid">
        <section class="admin-panel">
          <p class="section-kicker">最新密码</p>
          <div class="admin-password-card">
            <p class="admin-password-label">当前最新可发出的密码</p>
            <div class="admin-password-code" id="latest-password">尚未生成</div>
            <p class="helper-text" id="latest-meta">点击上方按钮后，这里会显示刚生成的新密码。</p>
          </div>

          <div class="admin-inline-actions">
            <button class="action-button action-button--primary" id="open-test-entry" type="button">打开测试入口</button>
            <button class="action-button" id="copy-test-link" type="button">复制测试入口链接</button>
          </div>
        </section>

        <section class="admin-panel admin-auth-card">
          <div class="admin-badge-row">
            <p class="section-kicker">管理员状态</p>
            <span class="status-pill status-pill--active" id="auth-state">连接中</span>
          </div>
          <p class="admin-auth-card__email" id="auth-email">正在建立匿名身份</p>
          <p class="helper-text" id="auth-hint">请稍等片刻。</p>
          <p class="helper-text">Supabase 项目：<span id="auth-project">未填写</span></p>

          <div class="admin-inline-actions">
            <button class="action-button action-button--primary" id="auth-sign-in" type="button">重新建立匿名身份</button>
            <button class="action-button" id="auth-claim" type="button">领取管理员身份</button>
            <button class="action-button" id="auth-sign-out" type="button">退出当前身份</button>
          </div>
        </section>
      </div>

      <div class="admin-grid">
        <section class="admin-panel">
          <p class="section-kicker">当前状态</p>
          <div class="admin-stats">
            <article class="admin-stat">
              <span class="admin-stat__label">未使用</span>
              <strong id="count-unused">0</strong>
            </article>
            <article class="admin-stat">
              <span class="admin-stat__label">进行中</span>
              <strong id="count-active">0</strong>
            </article>
            <article class="admin-stat">
              <span class="admin-stat__label">已作废</span>
              <strong id="count-used">0</strong>
            </article>
          </div>
          <p class="helper-text" id="admin-mode-note"></p>
        </section>

        <section class="admin-panel">
          <p class="section-kicker">使用顺序</p>
          <ul class="setup-list" id="admin-guide-list"></ul>
        </section>
      </div>

      <section class="admin-panel admin-panel--list">
        <div class="admin-panel__head">
          <div>
            <p class="section-kicker">密码列表</p>
            <h2>当前正式密码库</h2>
          </div>
          <p class="helper-text" id="admin-list-note"></p>
        </div>
        <div class="password-list" id="password-list"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./deployment-config.js?v=20260811-release-d"></script>
  <script src="./supabase-app-config.js?v=20260811-release-d"></script>
  <script type="module" src="./password-admin.js?v=20260811-release-d"></script>
</body>
</html>
